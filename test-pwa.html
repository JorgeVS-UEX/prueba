<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test PWA - Crystal Pro</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #bc8cff;
        }
        .pass { border-left-color: #3fb950; }
        .fail { border-left-color: #f85149; }
        .warn { border-left-color: #d29922; }
        h1 { color: #333; }
        code { background: #f0f0f0; padding: 2px 6px; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>🧪 Test PWA - Crystal Pro</h1>

    <div id="results"></div>

    <script>
        const tests = [];

        // Test 1: Service Worker
        if ('serviceWorker' in navigator) {
            tests.push({
                name: 'Service Worker Support',
                pass: true,
                msg: '✅ Service Worker soportado'
            });
        } else {
            tests.push({
                name: 'Service Worker Support',
                pass: false,
                msg: '❌ Service Worker NO soportado'
            });
        }

        // Test 2: Local Storage
        try {
            localStorage.setItem('test', 'test');
            localStorage.removeItem('test');
            tests.push({
                name: 'LocalStorage',
                pass: true,
                msg: '✅ LocalStorage funciona'
            });
        } catch (e) {
            tests.push({
                name: 'LocalStorage',
                pass: false,
                msg: '❌ LocalStorage NO funciona: ' + e.message
            });
        }

        // Test 3: Manifest
        fetch('manifest.json')
            .then(r => {
                tests.push({
                    name: 'manifest.json',
                    pass: r.ok,
                    msg: r.ok ? '✅ Manifest encontrado' : '❌ Manifest no encontrado'
                });
                renderTests();
            })
            .catch(e => {
                tests.push({
                    name: 'manifest.json',
                    pass: false,
                    msg: '❌ Error cargando manifest: ' + e.message
                });
                renderTests();
            });

        // Test 4: Service Worker registrado
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.ready
                .then(() => {
                    tests.push({
                        name: 'Service Worker Registrado',
                        pass: true,
                        msg: '✅ Service Worker registrado y activo'
                    });
                    renderTests();
                })
                .catch(e => {
                    tests.push({
                        name: 'Service Worker Registrado',
                        pass: false,
                        msg: '⚠️ Service Worker no está activo: ' + e.message
                    });
                    renderTests();
                });
        }

        // Test 5: HTTPS o localhost
        const isHttps = window.location.protocol === 'https:';
        const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const isFileProto = window.location.protocol === 'file:';
        
        if (isHttps || isLocalhost) {
            tests.push({
                name: 'Protocolo de Seguridad',
                pass: true,
                msg: '✅ ' + (isHttps ? 'HTTPS' : 'localhost') + ' (PWA compatible)'
            });
        } else if (isFileProto) {
            tests.push({
                name: 'Protocolo de Seguridad',
                pass: false,
                msg: '❌ file:// (no soporta PWA). Usa servidor local: python -m http.server 8000'
            });
        }

        // Test 6: Instalabilidad
        let installPrompt = false;
        window.addEventListener('beforeinstallprompt', () => {
            installPrompt = true;
            tests.push({
                name: 'Instalabilidad',
                pass: true,
                msg: '✅ App lista para instalar'
            });
            renderTests();
        });

        setTimeout(() => {
            if (!installPrompt) {
                tests.push({
                    name: 'Instalabilidad',
                    pass: false,
                    msg: '⚠️ App no está lista para instalar. Comprueba manifest.json'
                });
                renderTests();
            }
        }, 2000);

        function renderTests() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = tests.map(test => `
                <div class="test ${test.pass ? 'pass' : (test.msg.includes('⚠️') ? 'warn' : 'fail')}">
                    <strong>${test.name}</strong><br>
                    ${test.msg}
                </div>
            `).join('');

            const allPass = tests.filter(t => t.pass).length;
            const total = tests.length;
            
            const summary = `<div style="background: #e8f5e9; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: center;">
                <strong>${allPass}/${total} tests pasados</strong><br>
                ${allPass === total ? '✅ PWA completamente configurado' : '⚠️ Revisa los errores arriba'}
            </div>`;
            
            resultsDiv.innerHTML += summary;
        }

        // Iniciar
        renderTests();
    </script>
</body>
</html>
