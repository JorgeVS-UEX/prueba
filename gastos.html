<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Crystal Finance - Total Control</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #000000; --card: #111418; --card-border: #2d333b;
            --text-main: #f0f6fc; --text-dim: #8b949e; --accent: #bc8cff;
            --red: #f85149; --green: #3fb950;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text-main); margin: 0; padding: 15px; padding-bottom: 100px; }
        
        /* 1. GASTO TOTAL ARRIBA */
        .total-header { text-align: center; padding: 20px 0; background: linear-gradient(180deg, rgba(188,140,255,0.1) 0%, rgba(0,0,0,0) 100%); border-radius: 20px; margin-bottom: 10px; }
        .total-val { font-size: 3rem; font-weight: 900; color: var(--accent); display: block; text-shadow: 0 0 20px rgba(188,140,255,0.3); }
        
        /* 2. GRÁFICOS */
        .charts-container { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        .card { background: var(--card); border: 1px solid var(--card-border); border-radius: 20px; padding: 15px; }
        
        /* CATEGORÍAS */
        .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .cat-btn { 
            background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); 
            color: var(--text-main); padding: 15px; border-radius: 18px; cursor: pointer;
            text-align: left; position: relative;
        }
        .cat-btn b { display: block; font-size: 0.9rem; }
        .cat-btn span { font-size: 0.8rem; color: var(--accent); font-weight: bold; }
        .badge { position: absolute; top: 10px; right: 10px; font-size: 0.65rem; background: var(--accent); color: black; padding: 2px 6px; border-radius: 6px; font-weight: bold; }

        /* NUMPAD */
        #numpad-modal {
            position: fixed; bottom: -100%; left: 0; width: 100%; 
            background: #161b22; border-top: 3px solid var(--accent);
            border-top-left-radius: 30px; border-top-right-radius: 30px;
            padding: 20px; transition: 0.4s ease; z-index: 2000;
        }
        #numpad-modal.open { bottom: 0; }
        .num-key { background: #21262d; border: none; color: white; padding: 18px; border-radius: 12px; font-size: 1.3rem; font-weight: bold; }

        /* ACCIONES */
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(255,255,255,0.02); border-radius: 12px; margin-bottom: 6px; border-left: 3px solid var(--accent); }
        .btn-action { width: 100%; padding: 15px; border-radius: 15px; font-weight: bold; cursor: pointer; margin-top: 10px; border: 1px solid var(--card-border); background: none; color: var(--text-main); }
        .btn-export { border-color: var(--green); color: var(--green); }
        .btn-reset { border-color: var(--red); color: var(--red); }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; z-index: 1000; }
        .overlay.open { display: block; }
    </style>
</head>
<body>

<div id="overlay" class="overlay" onclick="closeNumpad()"></div>

<div class="container">
    <div class="total-header">
        <span style="font-size:0.7rem; color:var(--text-dim); letter-spacing: 2px;">GASTO DICIEMBRE</span>
        <span id="total-general" class="total-val">0.00€</span>
    </div>

    <div class="charts-container">
        <div class="card">
            <h2 style="font-size:0.7rem; color:var(--text-dim); margin-top:0">DISTRIBUCIÓN POR CATEGORÍA</h2>
            <canvas id="pieChart"></canvas>
        </div>
        <div class="card">
            <h2 style="font-size:0.7rem; color:var(--text-dim); margin-top:0">HISTÓRICO MENSUAL</h2>
            <canvas id="barChart"></canvas>
        </div>
    </div>

    <div class="cat-grid">
        <div class="cat-btn" onclick="registerGasto('Alquiler', 125)">
            <div id="count-Alquiler" class="badge">x0</div>
            <b>🏠 Alquiler</b><span>125€</span>
        </div>
        <div class="cat-btn" onclick="registerGasto('Transporte', 1.1)">
            <div id="count-Transporte" class="badge">x0</div>
            <b>🚌 Transporte</b><span>1.10€</span>
        </div>
        <div class="cat-btn" onclick="openNumpad('Luz')">
            <div id="count-Luz" class="badge">x0</div>
            <b>⚡ Luz</b><span id="val-Luz">0.00€</span>
        </div>
        <div class="cat-btn" onclick="openNumpad('Agua')">
            <div id="count-Agua" class="badge">x0</div>
            <b>💧 Agua</b><span id="val-Agua">0.00€</span>
        </div>
        <div class="cat-btn" onclick="openNumpad('Compra')">
            <div id="count-Compra" class="badge">x0</div>
            <b>🛒 Compra</b><span id="val-Compra">0.00€</span>
        </div>
        <div class="cat-btn" onclick="openNumpad('Comida')">
            <div id="count-Comida" class="badge">x0</div>
            <b>🍕 Comida</b><span id="val-Comida">0.00€</span>
        </div>
    </div>

    <h2 style="font-size: 0.7rem; color: var(--text-dim); margin: 25px 0 10px 5px;">MOVIMIENTOS DEL MES</h2>
    <div id="history-list"></div>
    
    <button class="btn-action btn-export" onclick="exportYearlyData()">📤 EXPORTAR GASTOS (CSV/EXCEL)</button>
    <button class="btn-action btn-reset" onclick="resetMes()">💾 CERRAR MES ACTUAL</button>
</div>

<div id="numpad-modal">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px">
        <span id="numpad-title" style="font-weight:bold; color:var(--accent)">CATEGORÍA</span>
        <div id="numpad-val" style="font-size:2rem; font-weight:900">0€</div>
    </div>
    <div class="numpad-grid" style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px;">
        <button class="num-key" onclick="pressKey('7')">7</button><button class="num-key" onclick="pressKey('8')">8</button><button class="num-key" onclick="pressKey('9')">9</button>
        <button class="num-key" onclick="pressKey('4')">4</button><button class="num-key" onclick="pressKey('5')">5</button><button class="num-key" onclick="pressKey('6')">6</button>
        <button class="num-key" onclick="pressKey('1')">1</button><button class="num-key" onclick="pressKey('2')">2</button><button class="num-key" onclick="pressKey('3')">3</button>
        <button class="num-key" onclick="pressKey('.')">.</button><button class="num-key" onclick="pressKey('0')">0</button>
        <button class="num-key" style="background:var(--red)" onclick="pressKey('C')">⌫</button>
        <button class="num-key" style="grid-column: span 3; background:var(--accent); color:black; margin-top:10px" onclick="confirmNumpad()">GUARDAR GASTO</button>
    </div>
</div>

<script>
    const meses = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
    // Inicializamos con historial vacío según tu petición
    let db = JSON.parse(localStorage.getItem('gastos_v8')) || {
        movimientos: [],
        historial: [] 
    };

    let activeCat = "", currentInput = "0", pieChart, barChart;

    function save() { localStorage.setItem('gastos_v8', JSON.stringify(db)); }

    // NUMPAD LOGIC
    function openNumpad(cat) {
        activeCat = cat; currentInput = "0";
        document.getElementById('numpad-title').innerText = cat.toUpperCase();
        document.getElementById('numpad-val').innerText = "0€";
        document.getElementById('numpad-modal').classList.add('open');
        document.getElementById('overlay').classList.add('open');
    }

    function closeNumpad() {
        document.getElementById('numpad-modal').classList.remove('open');
        document.getElementById('overlay').classList.remove('open');
    }

    function pressKey(key) {
        if (key === 'C') currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : "0";
        else if (key === '.') { if (!currentInput.includes('.')) currentInput += "."; }
        else currentInput = currentInput === "0" ? key : currentInput + key;
        document.getElementById('numpad-val').innerText = currentInput + "€";
    }

    function confirmNumpad() {
        const val = parseFloat(currentInput);
        if (val > 0) registerGasto(activeCat, val);
        closeNumpad();
    }

    // CORE LOGIC
    function registerGasto(cat, cant) {
        db.movimientos.unshift({ id: Date.now(), cat: cat, monto: cant, fecha: new Date().toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit', year:'numeric'}) });
        save(); render();
    }

    function deleteGasto(id) {
        db.movimientos = db.movimientos.filter(g => g.id !== id);
        save(); render();
    }

    function resetMes() {
        if(confirm("¿Cerrar el mes? Los datos se guardarán en la gráfica histórica y se limpiará el actual.")) {
            const total = db.movimientos.reduce((a, b) => a + b.monto, 0);
            db.historial.push({ mes: meses[new Date().getMonth()], total: total });
            db.movimientos = []; save(); render();
        }
    }

    function exportYearlyData() {
        let csv = "Fecha,Categoria,Importe\n";
        db.movimientos.forEach(g => {
            csv += `${g.fecha},${g.cat},${g.monto}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.setAttribute('href', url);
        a.setAttribute('download', `Gastos_${new Date().getFullYear()}.csv`);
        a.click();
    }

    function render() {
        const totals = { Alquiler:0, Transporte:0, Luz:0, Agua:0, Compra:0, Comida:0 };
        const counts = { Alquiler:0, Transporte:0, Luz:0, Agua:0, Compra:0, Comida:0 };
        let general = 0;

        db.movimientos.forEach(g => {
            if(totals.hasOwnProperty(g.cat)) { totals[g.cat] += g.monto; counts[g.cat]++; general += g.monto; }
        });

        document.getElementById('total-general').innerText = general.toFixed(2) + "€";
        for (let cat in totals) {
            const valEl = document.getElementById(`val-${cat}`);
            if(valEl) valEl.innerText = totals[cat].toFixed(2) + "€";
            document.getElementById(`count-${cat}`).innerText = "x" + counts[cat];
        }

        document.getElementById('history-list').innerHTML = db.movimientos.map(g => `
            <div class="history-item">
                <div style="flex:1"><b>${g.cat}</b> <small style="opacity:0.5">${g.fecha}</small></div>
                <div style="font-weight:bold; margin-right:15px">${g.monto.toFixed(2)}€</div>
                <button style="background:none; border:none; color:var(--red); font-size:1.2rem;" onclick="deleteGasto(${g.id})">✕</button>
            </div>
        `).join('') || '<center style="color:var(--text-dim); padding:20px;">Sin gastos este mes</center>';

        updateCharts(totals, general);
    }

    function updateCharts(totals, actual) {
        const ctxPie = document.getElementById('pieChart').getContext('2d');
        const ctxBar = document.getElementById('barChart').getContext('2d');
        
        if (pieChart) pieChart.destroy();
        if (barChart) barChart.destroy();

        // 1. Gráfica Circular con Leyenda
        pieChart = new Chart(ctxPie, {
            type: 'doughnut',
            data: {
                labels: Object.keys(totals),
                datasets: [{ data: Object.values(totals), backgroundColor: ['#bc8cff', '#388bfd', '#3fb950', '#ff9f43', '#00d2d3', '#ff5252'], borderWidth: 0 }]
            },
            options: { 
                plugins: { 
                    legend: { display: true, position: 'right', labels: { color: '#8b949e', font: { size: 10 } } } 
                },
                cutout: '60%' 
            }
        });

        // 2. Gráfica de Barras con Leyenda
        barChart = new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: [...db.historial.map(h => h.mes), "ACTUAL"],
                datasets: [{ 
                    label: 'Gasto por Mes',
                    data: [...db.historial.map(h => h.total), actual], 
                    backgroundColor: '#bc8cff', 
                    borderRadius: 5 
                }]
            },
            options: { 
                scales: { 
                    y: { grid: { color: '#2d333b' }, ticks: { color: '#8b949e' } }, 
                    x: { ticks: { color: '#8b949e' } } 
                },
                plugins: { legend: { labels: { color: '#8b949e' } } }
            }
        });
    }

    render();
</script>
</body>
</html>
